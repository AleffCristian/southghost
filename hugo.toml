baseURL = "https://southghost.com/"
title = "SouthGhost"
defaultContentLanguage = "pt-br"
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS"]

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    noClasses = false

[languages]
  [languages.pt-br]
    locale = "pt-BR"
    languageName = "Português"
    weight = 1

[params]
  description = "Software, infraestrutura, segurança e desenvolvimento."
  externalLinkDecoration = true
  displayUpdatedDate = true
  dateFormat = "02 de January de 2006"

  [params.navbar]
    displayTitle = true
    displayLogo = false
    width = "wide"

  [params.theme]
    default = "light"
    displayToggle = true

  [params.search]
    enable = true
    type = "flexsearch"

    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false
    width = "wide"

  [params.blog]
    [params.blog.list]
      displayTags = true
      sortBy = "date"
      sortOrder = "desc"
      pagerSize = 20

    [params.blog.article]
      displayPagination = true

  [params.toc]
    displayTags = true

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    pageRef = "/blog"
    weight = 1

  [[menu.main]]
    identifier = "docs"
    name = "Documentação"
    pageRef = "/docs"
    weight = 2

  [[menu.main]]
    identifier = "sobre"
    name = "Sobre"
    pageRef = "/sobre"
    weight = 3

  [[menu.main]]
    name = "Buscar"
    weight = 4
    [menu.main.params]
      type = "search"
